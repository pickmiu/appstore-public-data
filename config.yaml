# ==============================================================================
# App Store 公开数据监控与生命周期统一配置文件
# ==============================================================================

# 1. 数据保留与生命周期规则
retention:
  reviews_days: 180            # 评价默认保留天数 (半年)
  reviews_max_count: 10000     # 单个应用普通最新评价上限
  keep_all_helpful: true       # 永久保留所有“最有帮助”评价 (不受过期与1w条剔除影响)
  rankings_days: 180           # 榜单快照默认保留天数 (半年)

# 2. 监控应用列表 (增量评价监控)
# 涵盖核心大模型、垂直场景标杆与中国区头部梯队，精准匹配其上架国家 (US / CN)
monitored_apps:
  # --- 全球核心大模型与助手 ---
  - id: "6448311069"
    name: "ChatGPT"
    countries: ["us"]
  - id: "6670324846"
    name: "Grok AI"
    countries: ["us"]
  - id: "6794501026"
    name: "Grok Bot"
    countries: ["us"]
  - id: "6473753684"
    name: "Claude by Anthropic"
    countries: ["us"]

  # --- 垂直场景代表 (搜索、社交、视频、创意) ---
  - id: "1668000334"
    name: "Perplexity"
    countries: ["us"]
  - id: "6760173601"
    name: "Muse from Meta"
    countries: ["us"]
  - id: "6738049229"
    name: "Kling AI (可灵国际版)"
    countries: ["us"]
  - id: "6670396916"
    name: "可灵AI (国内版)"
    countries: ["cn"]
  - id: "1671705818"
    name: "Character AI"
    countries: ["us"]

  # --- 中国区头部大模型梯队 ---
  - id: "6459478672"
    name: "豆包"
    countries: ["cn"]
  - id: "6466733523"
    name: "通义千问"
    countries: ["cn"]
  - id: "6474233312"
    name: "Kimi"
    countries: ["cn", "us"]
  - id: "6737597349"
    name: "DeepSeek"
    countries: ["cn", "us"]

# 3. 榜单快照配置 (每日北京时间 00:00 执行)
rankings:
  # 监控地区列表 (默认仅抓取中国区与美国区，支持按需扩展)
  regions:
    - "cn"
    - "us"

  # 游戏过滤策略 (彻底排除所有游戏相关应用及子品类)
  exclude_games: true

  # 抓取深度限制
  # 注：Apple 官方公开 Top Free Feed API 单次物理硬上限为 100 款 (设置大于 100 无效)。
  # 启用 exclude_games 过滤游戏后，实际纯应用数量通常在 95~98 款之间。
  main_chart_limit: 100        # 主榜单前 N 名 (纯应用榜，自动过滤游戏)
  primary_genre_limit: 10      # 一级品类前 N 名 (默认 10)
  secondary_genre_limit: 5     # 二级品类前 N 名 (默认 5)

  # 一级品类配置 (已剔除游戏 6014，聚焦纯应用领域)
  primary_genres:
    - { id: 6005, name: "社交 (Social Networking)" }
    - { id: 6007, name: "效率 (Productivity)" }
    - { id: 6015, name: "财务 (Finance)" }
    - { id: 6002, name: "工具 (Utilities)" }
    - { id: 6008, name: "摄影与录像 (Photo & Video)" }
    - { id: 6016, name: "娱乐 (Entertainment)" }
    - { id: 6017, name: "教育 (Education)" }
    - { id: 6012, name: "生活 (Lifestyle)" }
    - { id: 6009, name: "新闻 (News)" }
    - { id: 6024, name: "购物 (Shopping)" }
    - { id: 6013, name: "健康健美 (Health & Fitness)" }
    - { id: 6000, name: "商务 (Business)" }

  # 二级品类配置 (因排除游戏，原游戏子品类 7001~7019 全部移除，默认不抓取游戏二级品类)
  secondary_genres: []

# 4. 洪峰监控与告警配置 (防漏抓满载检测)
monitoring:
  overflow_alert_threshold: 300   # 单次新增触碰上限预警阈值 (默认 300 条，结合 10 页满载触发 GitHub Actions 告警)

