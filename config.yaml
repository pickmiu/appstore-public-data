# 3. Rankings Snapshot Configuration (Daily at 00:00 CST / 16:00 UTC)
rankings:
  # Monitored regions (defaults to China and United States, expandable as needed)
  regions:
    - "cn"
    - "us"

  # Game filtering strategy (completely exclude games and subgenres)
  exclude_games: true

  # Fetch depth limits
  # Note: Apple official public Top Free Feed API has a hard physical ceiling of 100 apps.
  # With exclude_games enabled, non-game app count is typically between 95~98 apps.
  main_chart_limit: 100        # Main chart top N (non-game apps only, games filtered)
  primary_genre_limit: 10      # Primary category top N (default: 10)
  secondary_genre_limit: 5     # Secondary category top N (default: 5)

  # Primary category configuration (Games 6014 excluded, focusing on non-game categories)
  primary_genres:
    - { id: 6005, name: "Social Networking" }
    - { id: 6007, name: "Productivity" }
    - { id: 6015, name: "Finance" }
    - { id: 6002, name: "Utilities" }
    - { id: 6008, name: "Photo & Video" }
    - { id: 6016, name: "Entertainment" }
    - { id: 6017, name: "Education" }
    - { id: 6012, name: "Lifestyle" }
    - { id: 6009, name: "News" }
    - { id: 6024, name: "Shopping" }
    - { id: 6013, name: "Health & Fitness" }
    - { id: 6000, name: "Business" }

  # Secondary category configuration (defaults to empty since games are excluded)
  secondary_genres: []

# 4. Overflow Alert & Flood Monitoring (Ceiling Detection)
monitoring:
  overflow_alert_threshold: 300   # Alert threshold for new reviews hitting 500 ceiling in single run
