name: Daily Rankings Snapshot

on:
  workflow_dispatch:

concurrency:
  group: snapshot-rankings
  cancel-in-progress: false

jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Rankings Snapshot Pipeline
        run: |
          python3 main.py --mode rankings

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rankings/
          if git diff --staged --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi

          git commit -m "chore(data): daily App Store rankings snapshot [skip ci]"

          # Push with retry in case remote main moved
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin main; then
              echo "Successfully pushed changes to main."
              exit 0
            fi
            echo "Push failed, pulling latest remote changes and retrying ($i/$MAX_RETRIES)..."
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "Rebase conflict encountered; remote main already contains snapshot. Skipping."
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1
