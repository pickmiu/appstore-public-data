name: Monitor App Reviews

on:
  workflow_dispatch:

concurrency:
  group: monitor-reviews
  cancel-in-progress: false

# Grant write permissions for git commit and push
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reviews Pipeline
        run: |
          python3 main.py --mode reviews

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No review changes to commit."
          else
            if [ -f .commit_msg ]; then
              git commit -F .commit_msg
              rm -f .commit_msg
            else
              git commit -m "chore(data): auto-update App Store reviews [skip ci]"
            fi
            git pull --rebase origin main
            git push
          fi
